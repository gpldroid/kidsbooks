name: Reportar un problema
description: Informar de un error en el sitio o en la biblioteca.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: ¿Qué ha ocurrido?
      description: Describe el problema de forma clara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: false
